apiVersion: apps/v1
kind: Deployment
metadata:
  name: quan-ly-sinh-vien
spec:
  replicas: 3
  selector:
    matchLabels: { app: quan-ly-sinh-vien }
  template:
    metadata:
      labels: { app: quan-ly-sinh-vien }
    spec:
      containers:
        - name: app
          image: quan-ly-sinh-vien:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
---
apiVersion: v1
kind: Service
metadata:
  name: quan-ly-sinh-vien
spec:
  type: NodePort
  selector: { app: quan-ly-sinh-vien }
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
